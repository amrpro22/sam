<div id="appRoot" class="login-container">

<script>
    // ===================== SECURE HASHING UTILITY (SHA-256) =====================
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }
    
    // ===================== Language Management (English Primary) =====================
    let currentLanguage = 'en';
    
    const translations = {
        en: {
            loading: "Loading data...",
            selectEmployee: "-- Select Employee --",
            employeeLabel: "Employee Name",
            branchLabel: "Branch",
            passwordLabel: "Password (Access Code)",
            loginBtn: "Login",
            syncBadge: "Synced with Control Panel",
            loginTitle: "Login",
            loginSubtitle: "Employee Attendance System",
            selectBranch: "-- Select Branch --",
            loginSuccess: "Login successful",
            welcome: "Welcome",
            checkin: "Check In",
            checkout: "Check Out",
            logoutSystem: "Logout from System",
            syncFooter: "Synced with Main Dashboard",
            checkinSuccess: "Check-in successful, thank you",
            checkoutSuccess: "Check-out successful, thank you",
            langToggleAr: "العربية",
            langToggleEn: "English",
            notesTitle: "📢 Notices & Alerts",
            noNotes: "No new notices"
        },
        ar: {
            loading: "جاري تحميل البيانات...",
            selectEmployee: "-- اختر اسم الموظف --",
            employeeLabel: "اسم الموظف",
            branchLabel: "الفرع",
            passwordLabel: "كلمة المرور (رمز الدخول)",
            loginBtn: "تسجيل الدخول",
            syncBadge: "متزامن مع لوحة التحكم",
            loginTitle: "تسجيل الدخول",
            loginSubtitle: "نظام حضور وانصراف الموظفين",
            selectBranch: "-- اختر الفرع --",
            loginSuccess: "تم التسجيل بنجاح",
            welcome: "مرحباً",
            checkin: "تسجيل دخول",
            checkout: "تسجيل خروج",
            logoutSystem: "تسجيل خروج من النظام",
            syncFooter: "متزامن مع لوحة التحكم الرئيسية",
            checkinSuccess: "تم تسجيل الدخول بنجاح، شكراً لك",
            checkoutSuccess: "تم تسجيل الخروج بنجاح، شكراً لك",
            langToggleAr: "العربية",
            langToggleEn: "English",
            notesTitle: "📢 تنبيهات وملاحظات",
            noNotes: "لا توجد تنبيهات جديدة"
        }
    };
    
    function getText(key) {
        return translations[currentLanguage][key] || translations.en[key] || key;
    }
    
    function setLanguage(lang) {
        currentLanguage = lang;
        const htmlElement = document.documentElement;
        const bodyElement = document.body;
        
        if (lang === 'ar') {
            htmlElement.setAttribute('lang', 'ar');
            bodyElement.setAttribute('dir', 'rtl');
            document.title = "تسجيل الدخول | نظام حضور وانصراف الموظفين";
        } else {
            htmlElement.setAttribute('lang', 'en');
            bodyElement.setAttribute('dir', 'ltr');
            document.title = "Employee Attendance System | Login";
        }
        
        const langBtnText = document.getElementById('langBtnText');
        if (langBtnText) {
            langBtnText.textContent = lang === 'en' ? getText('langToggleAr') : getText('langToggleEn');
        }
        
        if (currentEmployee) {
            renderEmployeeDashboard();
        } else {
            renderLoginScreen();
        }
    }
    
    function toggleLanguage() {
        const newLang = currentLanguage === 'en' ? 'ar' : 'en';
        setLanguage(newLang);
    }
    
    // ===================== بيانات المتاجر والموظفين (من Firebase) =====================
    let shopsData = [];
    let currentEmployee = null;
    let currentBranch = null;
    
    // متغير لتخزين آخر ملاحظة تم عرضها للموظف الحالي
    let currentEmployeeNote = "";
    let noteUnsubscribe = null;
    
    // دالة عرض رسالة نجاح فقط
    function showSuccessMessage(message) {
        const existingToast = document.querySelector('.success-toast');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = 'success-toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }
    
    // دالة عرض رسالة عند وصول ملاحظة جديدة
    function showNoteAlert(message) {
        const existingToast = document.querySelector('.note-toast');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = 'note-toast';
        toast.innerHTML = `<i class="fas fa-bell"></i> ${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }
    
    function generateSecureAccessCode() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }
    
    async function hashEmployeePasswords(employees) {
        for (let emp of employees) {
            if (emp.accessCode && !emp.accessCode.startsWith('hashed_')) {
                const hashedPwd = await hashPassword(emp.accessCode);
                emp.accessCode = 'hashed_' + hashedPwd;
            } else if (!emp.accessCode) {
                const newCode = generateSecureAccessCode();
                const hashedPwd = await hashPassword(newCode);
                emp.accessCode = 'hashed_' + hashedPwd;
            }
        }
    }
    
    async function ensureAllEmployeesHaveSecurePasswords() {
        let updated = false;
        for (let shop of shopsData) {
            if (shop.employees && shop.employees.length) {
                for (let emp of shop.employees) {
                    if (!emp.accessCode) {
                        const newCode = generateSecureAccessCode();
                        const hashedPwd = await hashPassword(newCode);
                        emp.accessCode = 'hashed_' + hashedPwd;
                        updated = true;
                    } else if (!emp.accessCode.startsWith('hashed_')) {
                        const hashedPwd = await hashPassword(emp.accessCode);
                        emp.accessCode = 'hashed_' + hashedPwd;
                        updated = true;
                    }
                }
            }
        }
        if (updated && window.firebaseDB) {
            const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
            await window.firebaseSet(dbRef, shopsData);
        }
    }
    
    async function loadShopsFromFirebase() {
        if (!window.firebaseDB) return null;
        try {
            const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
            const snapshot = await window.firebaseGet(dbRef);
            if (snapshot.exists()) {
                return snapshot.val();
            }
            return null;
        } catch (error) {
            console.warn("خطأ في جلب بيانات المتاجر:", error.message);
            return null;
        }
    }
    
    async function saveAttendanceRecord(employeeName, branchName, type) {
        if (!window.firebaseDB) return null;
        try {
            const now = new Date();
            const record = {
                employeeName: employeeName,
                branchName: branchName,
                type: type,
                timestamp: now.toISOString(),
                date: now.toLocaleDateString(currentLanguage === 'ar' ? 'ar-EG' : 'en-US'),
                time: now.toLocaleTimeString(currentLanguage === 'ar' ? 'ar-EG' : 'en-US'),
                sessionId: Date.now() + '_' + Math.random().toString(36).substring(2, 8)
            };
            const attendanceRef = window.firebaseRef(window.firebaseDB, 'attendanceRecords');
            const newRecordRef = window.firebasePush(attendanceRef);
            await window.firebaseSet(newRecordRef, record);
            console.log(`✅ تم تسجيل ${type} للموظف ${employeeName}`);
            return record;
        } catch (error) {
            console.warn("خطأ في تسجيل الحضور:", error.message);
            return null;
        }
    }
    
    // دالة للاستماع إلى الملاحظات المرسلة للموظف الحالي من لوحة التحكم
    function listenToEmployeeNotes(employeeName, branchName) {
        if (noteUnsubscribe) {
            try { noteUnsubscribe(); } catch(e) {}
            noteUnsubscribe = null;
        }
        
        if (!window.firebaseDB) return;
        
        // مسار تخزين الملاحظات في Firebase
        const notesRef = window.firebaseRef(window.firebaseDB, 'employeeNotes');
        
        const handleNotesUpdate = (snapshot) => {
            if (!snapshot.exists()) return;
            
            const allNotes = snapshot.val();
            let latestNoteForEmployee = null;
            let latestTimestamp = 0;
            
            // البحث عن أحدث ملاحظة موجهة لهذا الموظف في هذا الفرع
            for (const key in allNotes) {
                const note = allNotes[key];
                if (note.employeeName === employeeName && note.branchName === branchName) {
                    const noteTime = new Date(note.timestamp).getTime();
                    if (noteTime > latestTimestamp) {
                        latestTimestamp = noteTime;
                        latestNoteForEmployee = note;
                    }
                }
            }
            
            if (latestNoteForEmployee) {
                const newNoteContent = latestNoteForEmployee.content;
                // إذا كانت الملاحظة مختلفة عن آخر ملاحظة معروضة، نقوم بتحديث الواجهة
                if (newNoteContent !== currentEmployeeNote) {
                    currentEmployeeNote = newNoteContent;
                    // تحديث حقل عرض الملاحظات في الواجهة
                    const notesContentDiv = document.getElementById('employeeNotesContent');
                    if (notesContentDiv) {
                        if (currentEmployeeNote && currentEmployeeNote.trim() !== "") {
                            notesContentDiv.innerHTML = `<div class="notes-content">${currentEmployeeNote}</div>`;
                            notesContentDiv.classList.remove('notes-empty');
                        } else {
                            notesContentDiv.innerHTML = `<div class="notes-content notes-empty"><i class="fas fa-info-circle"></i> ${getText('noNotes')}</div>`;
                            notesContentDiv.classList.add('notes-empty');
                        }
                    }
                    // إظهار تنبيه للموظف بوجود ملاحظة جديدة
                    if (latestNoteForEmployee.content && latestNoteForEmployee.content.trim() !== "") {
                        showNoteAlert(`📋 ${getText('notesTitle')}: ${latestNoteForEmployee.content.substring(0, 50)}${latestNoteForEmployee.content.length > 50 ? '...' : ''}`);
                    }
                }
            }
        };
        
        window.firebaseOnValue(notesRef, handleNotesUpdate);
        noteUnsubscribe = () => window.firebaseOnValue(notesRef, () => {});
    }

                { name: "نورة السبيعي", entryBase: "10:00", exitBase: "18:00", entryLabel: "10:00 صباحاً", exitLabel: "06:00 مساءً", accessCode: "444444" }

                { name: "لينا العتيبي", entryBase: "08:00", exitBase: "16:00", entryLabel: "08:00 صباحاً", exitLabel: "04:00 مساءً", accessCode: "666666" }

    function renderLoginScreen() {
        if (!shopsData.length) {
            document.getElementById('appRoot').innerHTML = `<div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> ${getText('loading')}</div>`;
            return;
        }
        
        let allEmployees = [];
        shopsData.forEach(shop => {
            if (shop.employees && shop.employees.length) {
                shop.employees.forEach(emp => {
                    allEmployees.push({
                        name: emp.name,
                        branchId: shop.id,
                        branchName: shop.name,
                        hashedCode: emp.accessCode || ""
                    });
                });
            }
        });
        
        let employeeOptions = `<option value="">${getText('selectEmployee')}</option>`;
        allEmployees.forEach(emp => {
            employeeOptions += `<option value="${emp.name}" data-branch-id="${emp.branchId}" data-branch-name="${emp.branchName}" data-hashed-code="${emp.hashedCode}">${emp.name}</option>`;
        });
        
        const html = `
            <div class="login-card">
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="fas fa-fingerprint"></i>
                    </div>
                    <div class="app-title">${getText('loginTitle')}</div>
                    <div class="app-subtitle">${getText('loginSubtitle')}</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user"></i> ${getText('employeeLabel')}</label>
                    <select id="employeeSelect" class="form-select">
                        ${employeeOptions}
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-store"></i> ${getText('branchLabel')}</label>
                    <select id="branchSelect" class="form-select" disabled>
                        <option value="">${getText('selectBranch')}</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-lock"></i> ${getText('passwordLabel')}</label>
                    <input type="password" id="passwordInput" class="form-input password-input" placeholder="••••••" autocomplete="off">
                </div>
                
                <button id="loginBtn" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> ${getText('loginBtn')}
                </button>
                
                <div class="sync-badge">
                    <i class="fas fa-cloud-upload-alt"></i> ${getText('syncBadge')}
                </div>
            </div>
        `;
        
        document.getElementById('appRoot').innerHTML = html;
        
        const employeeSelect = document.getElementById('employeeSelect');
        const branchSelect = document.getElementById('branchSelect');
        
        employeeSelect.addEventListener('change', () => {
            const selectedOption = employeeSelect.options[employeeSelect.selectedIndex];
            const branchId = selectedOption.getAttribute('data-branch-id');
            const branchName = selectedOption.getAttribute('data-branch-name');
            
            if (branchId && branchName) {
                branchSelect.innerHTML = `<option value="${branchId}" data-branch-name="${branchName}">${branchName}</option>`;
                branchSelect.disabled = false;
            } else {
                branchSelect.innerHTML = `<option value="">${getText('selectBranch')}</option>`;
                branchSelect.disabled = true;
            }
        });
        
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const employeeSelectElem = document.getElementById('employeeSelect');
            const selectedOption = employeeSelectElem.options[employeeSelectElem.selectedIndex];
            const employeeName = employeeSelectElem.value;
            const branchSelectElem = document.getElementById('branchSelect');
            const branchId = branchSelectElem.value;
            const branchName = branchSelectElem.options[branchSelectElem.selectedIndex]?.getAttribute('data-branch-name');
            const storedHashedCode = selectedOption.getAttribute('data-hashed-code');
            const enteredPassword = document.getElementById('passwordInput').value;
            
            if (!employeeName || !branchId || !storedHashedCode || !enteredPassword) {
                return;
            }
            
            const hashedEntered = 'hashed_' + await hashPassword(enteredPassword);
            
            let isValid = false;
            if (storedHashedCode && hashedEntered && storedHashedCode.length === hashedEntered.length) {
                isValid = storedHashedCode === hashedEntered;
            }
            
            if (!isValid) {
                return;
            }
            
            showSuccessMessage(getText('loginSuccess'));
            
            const shop = shopsData.find(s => s.id == branchId);
            if (shop) {
                const employee = shop.employees.find(e => e.name === employeeName);
                if (employee) {
                    currentEmployee = { 
                        name: employee.name, 
                        branchName: branchName, 
                        branchId: branchId,
                        entryBase: employee.entryBase,
                        exitBase: employee.exitBase
                    };
                    currentBranch = { id: branchId, name: branchName };
                    
                    // إعادة تعيين الملاحظة الحالية والاستماع للملاحظات الجديدة
                    currentEmployeeNote = "";
                    listenToEmployeeNotes(currentEmployee.name, currentBranch.name);
                    renderEmployeeDashboard();
                }
            }
        });
    }
    
    async function renderEmployeeDashboard() {
        if (!currentEmployee) return;
        
        // محتوى الملاحظة المراد عرضه
        const noteDisplayHtml = `
            <div class="notes-display-card">
                <div class="notes-header">
                    <i class="fas fa-bell"></i>
                    <span>${getText('notesTitle')}</span>
                </div>
                <div id="employeeNotesContent">
                    ${(currentEmployeeNote && currentEmployeeNote.trim() !== "") ? 
                        `<div class="notes-content">${currentEmployeeNote}</div>` : 
                        `<div class="notes-content notes-empty"><i class="fas fa-info-circle"></i> ${getText('noNotes')}</div>`}
                </div>
            </div>
        `;
        
        const html = `
            <div class="employee-dashboard">
                <div class="employee-header">
                    <div class="employee-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="welcome-name">${getText('welcome')} ${currentEmployee.name}</div>
                    <div class="branch-badge">
                        <i class="fas fa-store"></i> ${currentBranch.name}
                    </div>
                </div>
                
                ${noteDisplayHtml}
                
                <div class="actions-buttons">
                    <button id="checkinBtn" class="action-btn checkin-btn">
                        <i class="fas fa-sign-in-alt"></i> ${getText('checkin')}
                    </button>
                    <button id="checkoutBtn" class="action-btn checkout-btn">
                        <i class="fas fa-sign-out-alt"></i> ${getText('checkout')}
                    </button>
                </div>
                
                <button id="logoutFromDashboard" class="logout-btn">
                    <i class="fas fa-arrow-right"></i> ${getText('logoutSystem')}
                </button>
                
                <div class="sync-badge">
                    <i class="fas fa-check-circle"></i> ${getText('syncFooter')}
                </div>
            </div>
        `;
        
        document.getElementById('appRoot').innerHTML = html;
        
        document.getElementById('checkinBtn').addEventListener('click', async () => {
            await saveAttendanceRecord(currentEmployee.name, currentBranch.name, 'دخول');
            showSuccessMessage(getText('checkinSuccess'));
        });
        
        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            await saveAttendanceRecord(currentEmployee.name, currentBranch.name, 'خروج');
            showSuccessMessage(getText('checkoutSuccess'));
        });
        
        document.getElementById('logoutFromDashboard').addEventListener('click', () => {
            if (noteUnsubscribe) {
                try { noteUnsubscribe(); } catch(e) {}
                noteUnsubscribe = null;
            }
            currentEmployee = null;
            currentBranch = null;
            currentEmployeeNote = "";
            renderLoginScreen();
        });
    }
    
    function listenToFirebaseChanges() {
        if (!window.firebaseDB) return;
        const shopsRef = window.firebaseRef(window.firebaseDB, 'shopsData');
        window.firebaseOnValue(shopsRef, async (snapshot) => {
            if (snapshot.exists()) {
                shopsData = snapshot.val();
                await ensureAllEmployeesHaveSecurePasswords();
                if (currentEmployee) {
                    const shop = shopsData.find(s => s.id == currentBranch?.id);
                    if (shop && shop.employees.some(e => e.name === currentEmployee.name)) {
                        // الموظف لا يزال موجودًا
                    } else {
                        if (noteUnsubscribe) {
                            try { noteUnsubscribe(); } catch(e) {}
                            noteUnsubscribe = null;
                        }
                        currentEmployee = null;
                        currentBranch = null;
                        currentEmployeeNote = "";
                        renderLoginScreen();
                    }
                } else {
                    renderLoginScreen();
                }
            }
        });
    }
    
    let appStarted = false;
    
    const startApplication = async () => {
        if (appStarted) return;
        appStarted = true;
        
        const toggleBtn = document.getElementById('langToggleBtn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', toggleLanguage);
        }
        
        try {
            const savedShops = await loadShopsFromFirebase();
            if (savedShops && savedShops.length) {
                shopsData = savedShops;
                await ensureAllEmployeesHaveSecurePasswords();
            } else {
                shopsData = getDefaultShopsData();
                await ensureAllEmployeesHaveSecurePasswords();
                const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
                await window.firebaseSet(dbRef, shopsData);
            }
            
            listenToFirebaseChanges();
            renderLoginScreen();
        } catch (error) {
            console.error("خطأ في التهيئة:", error);
            shopsData = getDefaultShopsData();
            await ensureAllEmployeesHaveSecurePasswords();
            renderLoginScreen();
        }
    };
    
    window.addEventListener('firebaseLoginReady', startApplication);
    
    setTimeout(() => {
        if (!appStarted) {
            console.warn("تأخر Firebase، بدء التشغيل محلياً");
            startApplication();
        }
    }, 3000);
</script>
