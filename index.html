    // دالة عرض رسالة منبثقة
    function showToast(message, type = 'success') {
        const existingToast = document.querySelector('.toast-message');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = `toast-message ${type}`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }
    
    // دالة لتوليد رمز عشوائي
    function generateAccessCode() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }
    
    // التأكد من أن كل موظف لديه كلمة مرور (accessCode) وتحديثها في Firebase
    async function ensureAllEmployeesHavePassword() {
        let updated = false;
        for (let shop of shopsData) {
            if (shop.employees && shop.employees.length) {
                for (let emp of shop.employees) {
                    // استخدام accessCode ككلمة مرور (كما هو موجود في لوحة التحكم)
                    if (!emp.accessCode) {
                        emp.accessCode = generateAccessCode();
                        updated = true;
                        console.log(`تم إنشاء كلمة مرور للموظف ${emp.name}: ${emp.accessCode}`);
                    }
                }
            }
        }
        if (updated && window.firebaseDB) {
            const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
            await window.firebaseSet(dbRef, shopsData);
            console.log("✅ تم تحديث كلمات المرور في Firebase");
        }
    }
    
    // تحميل بيانات المتاجر والموظفين من Firebase
    async function loadShopsFromFirebase() {
        if (!window.firebaseDB) return null;
        try {
            const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
            const snapshot = await window.firebaseGet(dbRef);
            if (snapshot.exists()) {
                return snapshot.val();
            }
            return null;
        } catch (error) {
            console.warn("خطأ في جلب بيانات المتاجر:", error.message);
            return null;
        }
    }
    
    // تحميل سجل الحضور والانصراف من Firebase
    async function loadAttendanceFromFirebase() {
        if (!window.firebaseDB) return [];
        try {
            const attendanceRef = window.firebaseRef(window.firebaseDB, 'attendanceRecords');
            const snapshot = await window.firebaseGet(attendanceRef);
            const records = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (const key in data) {
                    records.push({ id: key, ...data[key] });
                }
            }
            records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            return records;
        } catch (error) {
            console.warn("خطأ في جلب سجل الحضور:", error.message);
            return [];
        }
    }
    
    // تسجيل دخول أو خروج في Firebase
    async function saveAttendanceRecord(employeeName, branchName, type) {
        if (!window.firebaseDB) return null;
        try {
            const now = new Date();
            const record = {
                employeeName: employeeName,
                branchName: branchName,
                type: type,
                timestamp: now.toISOString(),
                date: now.toLocaleDateString('ar-EG'),
                time: now.toLocaleTimeString('ar-EG')
            };
            const attendanceRef = window.firebaseRef(window.firebaseDB, 'attendanceRecords');
            const newRecordRef = window.firebasePush(attendanceRef);
            await window.firebaseSet(newRecordRef, record);
            console.log(`✅ تم تسجيل ${type} للموظف ${employeeName}`);
            return record;
        } catch (error) {
            console.warn("خطأ في تسجيل الحضور:", error.message);
            return null;
        }
    }

    // عرض شاشة تسجيل الدخول
    function renderLoginScreen() {
        if (!shopsData.length) {
            document.getElementById('appRoot').innerHTML = '<div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> جاري تحميل البيانات...</div>';

        }
        
        // تجميع جميع الموظفين من جميع المتاجر
        let allEmployees = [];
        shopsData.forEach(shop => {
            if (shop.employees && shop.employees.length) {
                shop.employees.forEach(emp => {
                    allEmployees.push({
                        name: emp.name,
                        branchId: shop.id,
                        branchName: shop.name,
                        accessCode: emp.accessCode || "000000"
                    });
                });
            }
        });
        
        let employeeOptions = '<option value="">-- اختر اسم الموظف --</option>';
        allEmployees.forEach(emp => {
            employeeOptions += `<option value="${emp.name}" data-branch-id="${emp.branchId}" data-branch-name="${emp.branchName}" data-access-code="${emp.accessCode}">${emp.name}</option>`;
        });
        
        const html = `

                    <select id="employeeSelect" class="form-select">
                        ${employeeOptions}

                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-store"></i> الفرع</label>
                    <select id="branchSelect" class="form-select" disabled>
                        <option value="">-- اختر الفرع --</option>
                    </select>
                </div>
                
                <div class="form-group">

                    <input type="password" id="passwordInput" class="form-input password-input" placeholder="أدخل كلمة المرور الخاصة بك">

        const employeeSelect = document.getElementById('employeeSelect');
        const branchSelect = document.getElementById('branchSelect');
        
        employeeSelect.addEventListener('change', () => {
            const selectedOption = employeeSelect.options[employeeSelect.selectedIndex];
            const branchId = selectedOption.getAttribute('data-branch-id');
            const branchName = selectedOption.getAttribute('data-branch-name');
            
            if (branchId && branchName) {

            const branchId = branchSelectElem.value;
            const branchName = branchSelectElem.options[branchSelectElem.selectedIndex]?.getAttribute('data-branch-name');
            const expectedAccessCode = selectedOption.getAttribute('data-access-code');
            const enteredPassword = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('errorMsg');
            
            errorDiv.style.display = 'none';
            
            if (!employeeName) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = '❌ الرجاء اختيار اسم الموظف';
                return;
            }
            if (!branchId) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = '❌ الرجاء اختيار الفرع';
                return;
            }
            if (!expectedAccessCode) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = '❌ هذا الموظف ليس لديه كلمة مرور مسجلة، يرجى التواصل مع المدير';
                return;
            }
            if (enteredPassword !== expectedAccessCode) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = '❌ كلمة المرور غير صحيحة';
                return;
            }
            
            errorDiv.style.display = 'none';
            
            const shop = shopsData.find(s => s.id == branchId);
            if (shop) {
                const employee = shop.employees.find(e => e.name === employeeName);
                if (employee) {
                    currentEmployee = { ...employee, branchName: branchName, branchId: branchId };
                    currentBranch = { id: branchId, name: branchName };
                    renderEmployeeDashboard();
                }
            }
        });
    }
    
    // عرض لوحة تحكم الموظف
    async function renderEmployeeDashboard() {
        if (!currentEmployee) return;
        
        const allRecords = await loadAttendanceFromFirebase();
        const history = getEmployeeHistory(currentEmployee.name, currentBranch.name, allRecords);
        const lastRecord = history.length > 0 ? history[0] : null;
        
        let historyHtml = '';
        history.slice(0, 15).forEach(record => {
            historyHtml += `
                <div class="history-item">
                    <span class="history-type ${record.type === 'دخول' ? 'checkin' : 'checkout'}">
                        <i class="fas ${record.type === 'دخول' ? 'fa-sign-in-alt' : 'fa-sign-out-alt'}"></i> ${record.type}
                    </span>
                    <span class="history-time">${record.date} | ${record.time}</span>
                </div>
            `;
        });
        
        if (historyHtml === '') {
            historyHtml = '<div style="text-align:center; padding:20px; color:#94a3b8;">لا توجد سجلات حضور بعد</div>';
        }
        
        const html = `
            <div class="employee-dashboard">
                <div class="employee-header">
                    <div class="employee-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="welcome-name">مرحباً ${currentEmployee.name}</div>
                    <div class="branch-badge">
                        <i class="fas fa-store"></i> ${currentBranch.name}
                    </div>
                </div>
                
                ${lastRecord ? `
                <div class="last-record">
                    <i class="fas fa-history"></i> آخر تسجيل: 
                    <strong>${lastRecord.type}</strong> بتاريخ ${lastRecord.date} الساعة ${lastRecord.time}
                </div>
                ` : '<div class="last-record">لا توجد تسجيلات سابقة</div>'}
                
                <div class="actions-buttons">
                    <button id="checkinBtn" class="action-btn checkin-btn">
                        <i class="fas fa-sign-in-alt"></i> تسجيل دخول
                    </button>
                    <button id="checkoutBtn" class="action-btn checkout-btn">
                        <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                    </button>
                </div>
                
                <div style="margin-top: 20px;">
                    <div style="font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-list-ul" style="color: #4361ee;"></i> سجل الحضور والانصراف
                    </div>
                    <div class="history-list">
                        ${historyHtml}
                    </div>
                </div>
                
                <button id="logoutFromDashboard" class="logout-btn">
                    <i class="fas fa-arrow-right"></i> تسجيل خروج من النظام
                </button>
                
                <div class="sync-badge">
                    <i class="fas fa-check-circle"></i> متزامن مع لوحة التحكم الرئيسية
                </div>
            </div>
        `;
        
        document.getElementById('appRoot').innerHTML = html;
        
        document.getElementById('checkinBtn').addEventListener('click', async () => {
            await saveAttendanceRecord(currentEmployee.name, currentBranch.name, 'دخول');
            showToast(`✅ تم تسجيل دخولك بنجاح، شكراً لك`, 'success');
            renderEmployeeDashboard();
        });
        
        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            await saveAttendanceRecord(currentEmployee.name, currentBranch.name, 'خروج');
            showToast(`✅ تم تسجيل خروجك بنجاح، شكراً لك`, 'success');
            renderEmployeeDashboard();
        });
        
        document.getElementById('logoutFromDashboard').addEventListener('click', () => {
            currentEmployee = null;
            currentBranch = null;
            renderLoginScreen();
        });
    }
    
    // الاستماع للتغييرات في Firebase
    function listenToFirebaseChanges() {
        if (!window.firebaseDB) return;
        const shopsRef = window.firebaseRef(window.firebaseDB, 'shopsData');
        window.firebaseOnValue(shopsRef, async (snapshot) => {
            if (snapshot.exists()) {
                shopsData = snapshot.val();
                await ensureAllEmployeesHavePassword();
                if (currentEmployee) {
                    const shop = shopsData.find(s => s.id == currentBranch?.id);
                    if (shop) {
                        const stillExists = shop.employees.some(e => e.name === currentEmployee.name);
                        if (!stillExists) {
                            currentEmployee = null;
                            currentBranch = null;
                            renderLoginScreen();
                        }
                    } else {
                        currentEmployee = null;
                        currentBranch = null;
                        renderLoginScreen();
                    }
                } else {
                    renderLoginScreen();
                }
            }
        });
    }
    
    // تهيئة التطبيق
    let appStarted = false;
    
    const startApplication = async () => {
        if (appStarted) return;
        appStarted = true;
        
        try {
            const savedShops = await loadShopsFromFirebase();
            if (savedShops && savedShops.length) {
                shopsData = savedShops;
                await ensureAllEmployeesHavePassword();
            } else {
                shopsData = getDefaultShopsData();
                const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
                await window.firebaseSet(dbRef, shopsData);
            }
            
            listenToFirebaseChanges();
            renderLoginScreen();
        } catch (error) {
            console.error("خطأ في التهيئة:", error);
            shopsData = getDefaultShopsData();
            renderLoginScreen();
        }
    };
    
    window.addEventListener('firebaseLoginReady', startApplication);
    
    setTimeout(() => {
        if (!appStarted) {
            console.warn("تأخر Firebase، بدء التشغيل محلياً");
            startApplication();
        }
    }, 3000);
</script>
</body>
</html>
