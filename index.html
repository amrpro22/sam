<!DOCTYPE html>

        const firebaseConfig = {

    <style>
        * {

        /* تثبيت التصميم بالكامل - لا تمرير أفقي ولا حركة */
        html, body {

            align-items: center;
            justify-content: center;
            padding: 16px;

        .logo-area {

        }
        
        .logo-icon {

        }
        
        .app-title {

            color: #1e293b;
            margin-bottom: 6px;
        }
        
        .app-subtitle {
            font-size: 0.8rem;

        }

        .form-group {

        }
        
        .form-label {

        .form-select, .form-input {

        .form-select:focus, .form-input:focus {

        }
        
        .password-input {

        .login-btn {

            cursor: pointer;
            display: flex;

        }

        }

        /* شاشة الموظف بعد تسجيل الدخول - بدون سجل الحضور */

            border-radius: 32px;

        /* منطقة الأزرار فقط */
        .actions-buttons {

        }
        
        .action-btn {
            flex: 1;
            padding: 16px;

            border-radius: 24px;

            justify-content: center;

        .action-btn:active {
            transform: scale(0.97);
        }
        
        .checkin-btn {
            background: #10b981;
            color: white;
        }
        
        .checkout-btn {
            background: #ef4444;
            color: white;
        }
        
        .logout-btn {
            width: 100%;
            background: #f1f5f9;
            border: none;
            border-radius: 20px;
            padding: 14px;
            color: #4361ee;
            font-weight: 700;
            cursor: pointer;

            font-size: 0.7rem;

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.2rem;

            backdrop-filter: blur(4px);
        }
        
        /* رسالة النجاح فقط (تم التسجيل بنجاح) */
        .success-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
        }
        
        .success-toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        
        /* تثبيت التصميم للشاشات الصغيرة جدًا */
        @media (max-width: 550px) {
            body {
                padding: 12px;
                align-items: center;
            }
            .login-card, .employee-dashboard {

                border-radius: 28px;
            }
            .actions-buttons {
                flex-direction: column;
                gap: 12px;
            }
            .app-title {
                font-size: 1.4rem;
            }
            .logo-icon {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
            .welcome-name {
                font-size: 1.2rem;
            }
            .action-btn {
                padding: 14px;
            }
            .success-toast {
                white-space: normal;
                text-align: center;
                max-width: 85%;
                font-size: 0.85rem;
                padding: 10px 20px;
                bottom: 20px;
            }
        }
        
        /* منع أي انزلاق أفقي */
        @media (max-width: 480px) {
            .login-card, .employee-dashboard {
                padding: 20px 16px;
            }
            .form-select, .form-input {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
<div id="appRoot" class="login-container">
    <div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> جاري تحميل البيانات...</div>
</div>

<script>
    // ===================== بيانات المتاجر والموظفين (من Firebase) =====================
    let shopsData = [];
    
    // المستخدم الحالي
    let currentEmployee = null;
    let currentBranch = null;
    
    // دالة عرض رسالة نجاح فقط (تم التسجيل بنجاح - بدون أي رسائل خطأ)
    function showSuccessMessage(message) {
        const existingToast = document.querySelector('.success-toast');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = 'success-toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 10);
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }
    
    // دالة لتوليد رمز عشوائي
    function generateAccessCode() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }
    
    // التأكد من أن كل موظف لديه كلمة مرور
    async function ensureAllEmployeesHavePassword() {
        let updated = false;
        for (let shop of shopsData) {
            if (shop.employees && shop.employees.length) {
                for (let emp of shop.employees) {
                    if (!emp.accessCode) {
                        emp.accessCode = generateAccessCode();
                        updated = true;
                        console.log(`تم إنشاء كلمة مرور للموظف ${emp.name}`);
                    }
                }
            }
        }
        if (updated && window.firebaseDB) {
            const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
            await window.firebaseSet(dbRef, shopsData);
            console.log("✅ تم تحديث كلمات المرور في Firebase");
        }
    }
    
    // تحميل بيانات المتاجر والموظفين من Firebase
    async function loadShopsFromFirebase() {
        if (!window.firebaseDB) return null;
        try {
            const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
            const snapshot = await window.firebaseGet(dbRef);
            if (snapshot.exists()) {
                return snapshot.val();
            }
            return null;
        } catch (error) {
            console.warn("خطأ في جلب بيانات المتاجر:", error.message);
            return null;
        }
    }
    
    // تسجيل دخول أو خروج في Firebase (بدون عرض السجل في هذه الواجهة)
    async function saveAttendanceRecord(employeeName, branchName, type) {
        if (!window.firebaseDB) return null;
        try {
            const now = new Date();
            const record = {
                employeeName: employeeName,
                branchName: branchName,
                type: type,
                timestamp: now.toISOString(),
                date: now.toLocaleDateString('ar-EG'),
                time: now.toLocaleTimeString('ar-EG')
            };
            const attendanceRef = window.firebaseRef(window.firebaseDB, 'attendanceRecords');
            const newRecordRef = window.firebasePush(attendanceRef);
            await window.firebaseSet(newRecordRef, record);
            console.log(`✅ تم تسجيل ${type} للموظف ${employeeName}`);
            return record;
        } catch (error) {
            console.warn("خطأ في تسجيل الحضور:", error.message);
            return null;
        }
    }
    
    // دالة للحصول على البيانات الافتراضية

        return [
            { id: 1, name: "متجر الأندلس", icon: "fas fa-crown", desc: "أفخر التشكيلات", employees: [
                { name: "أحمد الشجاع", entryBase: "08:30", exitBase: "16:30", entryLabel: "08:30 صباحاً", exitLabel: "04:30 مساءً", accessCode: "111111" },
                { name: "سارة المنصور", entryBase: "09:00", exitBase: "17:00", entryLabel: "09:00 صباحاً", exitLabel: "05:00 مساءً", accessCode: "222222" },
                { name: "يوسف الحمادي", entryBase: "08:45", exitBase: "16:45", entryLabel: "08:45 صباحاً", exitLabel: "04:45 مساءً", accessCode: "333333" },
                { name: "نورة السبيعي", entryBase: "10:00", exitBase: "18:00", entryLabel: "10:00 صباحاً", exitLabel: "06:00 مساءً", accessCode: "444444" }
            ]},
            { id: 2, name: "رواد الخليج", icon: "fas fa-ship", desc: "ريادة في البحر", employees: [
                { name: "خالد النقبي", entryBase: "07:30", exitBase: "15:30", entryLabel: "07:30 صباحاً", exitLabel: "03:30 مساءً", accessCode: "555555" },
                { name: "لينا العتيبي", entryBase: "08:00", exitBase: "16:00", entryLabel: "08:00 صباحاً", exitLabel: "04:00 مساءً", accessCode: "666666" }
            ]},
            { id: 3, name: "زهور الشجاع", icon: "fas fa-leaf", desc: "طبيعة ورفاهية", employees: [
                { name: "ريم الهاجري", entryBase: "08:00", exitBase: "16:00", entryLabel: "08:00 صباحاً", exitLabel: "04:00 مساءً", accessCode: "777777" },
                { name: "ناصر العتيق", entryBase: "09:00", exitBase: "17:00", entryLabel: "09:00 صباحاً", exitLabel: "05:00 مساءً", accessCode: "888888" }
            ]},
            { id: 4, name: "الدرة بلازا", icon: "fas fa-gem", desc: "فخامة وتميز", employees: [
                { name: "جمال السالم", entryBase: "08:15", exitBase: "16:15", entryLabel: "08:15 صباحاً", exitLabel: "04:15 مساءً", accessCode: "999999" },
                { name: "هبة العبيد", entryBase: "09:30", exitBase: "17:30", entryLabel: "09:30 صباحاً", exitLabel: "05:30 مساءً", accessCode: "101010" }
            ]},
            { id: 5, name: "نخبة الشرق", icon: "fas fa-chart-line", desc: "ريادة أعمال", employees: [
                { name: "ماجد الشهراني", entryBase: "07:00", exitBase: "15:00", entryLabel: "07:00 صباحاً", exitLabel: "03:00 مساءً", accessCode: "111111" },
                { name: "نوال الغامدي", entryBase: "08:20", exitBase: "16:20", entryLabel: "08:20 صباحاً", exitLabel: "04:20 مساءً", accessCode: "121212" }
            ]},
            { id: 6, name: "قمة الشجاع", icon: "fas fa-mountain", desc: "أعلى القمم", employees: [
                { name: "تركي العتيبي", entryBase: "08:00", exitBase: "16:00", entryLabel: "08:00 صباحاً", exitLabel: "04:00 مساءً", accessCode: "131313" },
                { name: "جواهر القاسم", entryBase: "09:15", exitBase: "17:15", entryLabel: "09:15 صباحاً", exitLabel: "05:15 مساءً", accessCode: "141414" }
            ]}
        ];
    }
    
    // عرض شاشة تسجيل الدخول (بدون أي رسائل خطأ مرئية)
    function renderLoginScreen() {
        if (!shopsData.length) {
            document.getElementById('appRoot').innerHTML = '<div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> جاري تحميل البيانات...</div>';
            return;
        }
        
        // تجميع جميع الموظفين من جميع المتاجر
        let allEmployees = [];
        shopsData.forEach(shop => {
            if (shop.employees && shop.employees.length) {
                shop.employees.forEach(emp => {
                    allEmployees.push({
                        name: emp.name,
                        branchId: shop.id,
                        branchName: shop.name,
                        accessCode: emp.accessCode || "000000"
                    });
                });
            }
        });
        
        let employeeOptions = '<option value="">-- اختر اسم الموظف --</option>';
        allEmployees.forEach(emp => {
            employeeOptions += `<option value="${emp.name}" data-branch-id="${emp.branchId}" data-branch-name="${emp.branchName}" data-access-code="${emp.accessCode}">${emp.name}</option>`;
        });
        
        const html = `
            <div class="login-card">
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="fas fa-fingerprint"></i>
                    </div>
                    <div class="app-title">تسجيل الدخول</div>
                    <div class="app-subtitle">نظام حضور وانصراف الموظفين</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user"></i> اسم الموظف</label>
                    <select id="employeeSelect" class="form-select">
                        ${employeeOptions}
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-store"></i> الفرع</label>
                    <select id="branchSelect" class="form-select" disabled>
                        <option value="">-- اختر الفرع --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-lock"></i> كلمة المرور (رمز الدخول)</label>
                    <input type="password" id="passwordInput" class="form-input password-input" placeholder="أدخل كلمة المرور الخاصة بك">
                </div>
                
                <button id="loginBtn" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
                
                <div class="sync-badge">
                    <i class="fas fa-cloud-upload-alt"></i> متزامن مع لوحة التحكم
                </div>
            </div>
        `;
        
        document.getElementById('appRoot').innerHTML = html;
        
        const employeeSelect = document.getElementById('employeeSelect');
        const branchSelect = document.getElementById('branchSelect');
        
        employeeSelect.addEventListener('change', () => {
            const selectedOption = employeeSelect.options[employeeSelect.selectedIndex];
            const branchId = selectedOption.getAttribute('data-branch-id');
            const branchName = selectedOption.getAttribute('data-branch-name');
            
            if (branchId && branchName) {
                branchSelect.innerHTML = `<option value="${branchId}" data-branch-name="${branchName}">${branchName}</option>`;
                branchSelect.disabled = false;
            } else {
                branchSelect.innerHTML = '<option value="">-- اختر الفرع --</option>';
                branchSelect.disabled = true;
            }
        });
        
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const employeeSelectElem = document.getElementById('employeeSelect');
            const selectedOption = employeeSelectElem.options[employeeSelectElem.selectedIndex];
            const employeeName = employeeSelectElem.value;
            const branchSelectElem = document.getElementById('branchSelect');
            const branchId = branchSelectElem.value;
            const branchName = branchSelectElem.options[branchSelectElem.selectedIndex]?.getAttribute('data-branch-name');
            const expectedAccessCode = selectedOption.getAttribute('data-access-code');
            const enteredPassword = document.getElementById('passwordInput').value;
            
            // التحقق من صحة البيانات بدون أي رسائل خطأ (صامت)
            if (!employeeName || !branchId || !expectedAccessCode || enteredPassword !== expectedAccessCode) {
                // في حالة الخطأ لا يحدث شيء ولا تظهر أي رسالة
                return;
            }
            
            // فقط عند النجاح تظهر رسالة "تم التسجيل بنجاح"
            showSuccessMessage("تم التسجيل بنجاح");
            
            const shop = shopsData.find(s => s.id == branchId);
            if (shop) {
                const employee = shop.employees.find(e => e.name === employeeName);
                if (employee) {
                    currentEmployee = { ...employee, branchName: branchName, branchId: branchId };
                    currentBranch = { id: branchId, name: branchName };
                    renderEmployeeDashboard();
                }
            }
        });
    }
    
    // عرض لوحة الموظف (بدون سجل الحضور والانصراف)
    async function renderEmployeeDashboard() {
        if (!currentEmployee) return;
        
        const html = `
            <div class="employee-dashboard">
                <div class="employee-header">
                    <div class="employee-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="welcome-name">مرحباً ${currentEmployee.name}</div>
                    <div class="branch-badge">
                        <i class="fas fa-store"></i> ${currentBranch.name}
                    </div>
                </div>
                
                <div class="actions-buttons">
                    <button id="checkinBtn" class="action-btn checkin-btn">
                        <i class="fas fa-sign-in-alt"></i> تسجيل دخول
                    </button>
                    <button id="checkoutBtn" class="action-btn checkout-btn">
                        <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                    </button>
                </div>
                
                <button id="logoutFromDashboard" class="logout-btn">
                    <i class="fas fa-arrow-right"></i> تسجيل خروج من النظام
                </button>
                
                <div class="sync-badge">
                    <i class="fas fa-check-circle"></i> متزامن مع لوحة التحكم الرئيسية
                </div>
            </div>
        `;
        
        document.getElementById('appRoot').innerHTML = html;
        
        document.getElementById('checkinBtn').addEventListener('click', async () => {
            await saveAttendanceRecord(currentEmployee.name, currentBranch.name, 'دخول');
            showSuccessMessage("تم تسجيل الدخول بنجاح، شكراً لك");
            // لا نقوم بإعادة تحميل السجل لأنه غير موجود في هذه الواجهة
        });
        
        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            await saveAttendanceRecord(currentEmployee.name, currentBranch.name, 'خروج');
            showSuccessMessage("تم تسجيل الخروج بنجاح، شكراً لك");
        });
        
        document.getElementById('logoutFromDashboard').addEventListener('click', () => {
            currentEmployee = null;
            currentBranch = null;
            renderLoginScreen();
        });
    }
    
    // الاستماع للتغييرات في Firebase
    function listenToFirebaseChanges() {
        if (!window.firebaseDB) return;
        const shopsRef = window.firebaseRef(window.firebaseDB, 'shopsData');
        window.firebaseOnValue(shopsRef, async (snapshot) => {
            if (snapshot.exists()) {
                shopsData = snapshot.val();
                await ensureAllEmployeesHavePassword();
                if (currentEmployee) {
                    const shop = shopsData.find(s => s.id == currentBranch?.id);
                    if (shop && shop.employees.some(e => e.name === currentEmployee.name)) {
                        // الموظف لا يزال موجودًا، نبقى في الواجهة
                    } else {
                        currentEmployee = null;
                        currentBranch = null;
                        renderLoginScreen();
                    }
                } else {
                    renderLoginScreen();
                }
            }
        });
    }
    
    // تهيئة التطبيق
    let appStarted = false;
    
    const startApplication = async () => {
        if (appStarted) return;
        appStarted = true;
        
        try {
            const savedShops = await loadShopsFromFirebase();
            if (savedShops && savedShops.length) {
                shopsData = savedShops;
                await ensureAllEmployeesHavePassword();
            } else {
                shopsData = getDefaultShopsData();
                const dbRef = window.firebaseRef(window.firebaseDB, 'shopsData');
                await window.firebaseSet(dbRef, shopsData);
            }
            
            listenToFirebaseChanges();
            renderLoginScreen();
        } catch (error) {
            console.error("خطأ في التهيئة:", error);
            shopsData = getDefaultShopsData();
            renderLoginScreen();
        }
    };
    
    window.addEventListener('firebaseLoginReady', startApplication);
    
    setTimeout(() => {
        if (!appStarted) {
            console.warn("تأخر Firebase، بدء التشغيل محلياً");
            startApplication();
        }
    }, 3000);
</script>
</body>
</html>
